; fumii — ACEBOTT QD020 quadruped (ESP8266) firmware
; Web-UI control panel: v3 fast/snappy motion
;
; Build:   pio run
; Flash:   pio run --target upload
; Monitor: pio device monitor
;
; The .ino sketch is also fully compatible with the Arduino IDE (ESP8266 core).
; This file is provided so the quadbot target can be built alongside the
; ESP32-S3 fumii firmware using the same `pio` toolchain.

[env:quadbot-esp8266]
platform      = espressif8266
board         = d1_mini        ; swap for nodemcuv2, esp01_1m, etc. if your board differs
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; ESP8266WiFi, ESP8266WebServer and Servo are bundled with the ESP8266 Arduino
; core — no extra lib_deps required.
